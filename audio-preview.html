<!DOCTYPE html>
<html lang="mn"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Хоёр ертөнц — дуу (2-р бүлэг)</title>
<style>
  html,body{margin:0;background:#0b0a09;color:#e9e4d8;font:15px/1.4 Georgia,serif}
  main{max-width:760px;margin:0 auto;padding:28px 18px 40px}
  h1{font-weight:normal;letter-spacing:.35em;font-size:22px;margin:0 0 4px}
  .sub{color:#9d978b;margin:0 0 22px;font-size:13px;letter-spacing:.05em}
  h2{font-weight:normal;font-size:13px;letter-spacing:.25em;color:#9d978b;margin:26px 0 10px;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
  button{min-height:44px;background:#16140f;color:#e9e4d8;border:1px solid #2c2820;border-radius:3px;font:inherit;cursor:pointer;text-align:left;padding:8px 12px}
  button:hover{border-color:#5a5243}
  button small{display:block;color:#7d776b;font:11px/1.3 monospace}
  button.dead{border-left:3px solid #7fa7e6}
  button.live{border-left:3px solid #d0343a}
  button.on{background:#2a1214;border-color:#d0343a}
  .row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  label{color:#9d978b;font-size:13px}
  input[type=range]{width:160px;vertical-align:middle}
  #st{color:#7d776b;font:12px monospace;margin-top:24px}
</style>
</head><body>
<main>
  <h1>ХОЁР ЕРТӨНЦ</h1>
  <p class="sub">2-р бүлэг · Чонын хөндий — дууны дээж. Аль нэг товч дармагц дуу асна.</p>

  <div class="row">
    <label>Дууны хүч (vol) <input id="vol" type="range" min="0" max="1" step="0.05" value="1"> <span id="volv">1.00</span></label>
    <label><input id="bed" type="checkbox"> Үндсэн салхи (prototype wind)</label>
  </div>

  <h2>Амьдын ертөнц</h2>
  <div class="grid">
    <button class="live" data-sfx="wolfStep">Чонын алхаа<small>wolfStep</small></button>
    <button class="live" data-sfx="wolfGrowl">Чонын архираа<small>wolfGrowl</small></button>
    <button class="live" data-sfx="wolfBark">Чонын хуцаа<small>wolfBark</small></button>
    <button class="live" data-sfx="wolfHowl">Чонын улиа<small>wolfHowl</small></button>
    <button class="live" data-sfx="ravenCaw">Хэрээний гуаглаа<small>ravenCaw</small></button>
    <button class="live" data-sfx="ravenFlap">Хэрээний далавч<small>ravenFlap</small></button>
    <button class="live" data-sfx="grassRustle">Өвсний шаршаа<small>grassRustle</small></button>
    <button class="live" data-sfx="heartbeat">Зүрхний цохилт<small>heartbeat</small></button>
  </div>

  <h2>Үхэгсдийн ертөнц</h2>
  <div class="grid">
    <button class="dead" data-sfx="shulamBreath">Шуламын амьсгал<small>shulamBreath</small></button>
    <button class="dead" data-sfx="shulamShriek">Шуламын хашгираа<small>shulamShriek</small></button>
    <button class="dead" data-sfx="shulamCrawl">Шуламын мөлхөө<small>shulamCrawl</small></button>
    <button class="dead" data-sfx="bones">Ясны хагарал<small>bones</small></button>
  </div>

  <h2>Хослол</h2>
  <div class="grid">
    <button id="trot">Чоно гүйж ирэх<small>wolfStep ×8 → wolfGrowl</small></button>
    <button id="walkBones">Ясан дээгүүр алхах<small>bones ×4</small></button>
  </div>

  <h2>Хөгжим (асаах / унтраах)</h2>
  <div class="grid">
    <button data-music="chase">Хөөцөлдөөн<small>music.chase</small></button>
    <button data-music="valley">Хөндийн шөнө<small>music.valley</small></button>
  </div>

  <div id="st">AudioContext: —</div>
</main>

<script>
window.TW = { sfxExt: {}, music: {} };
</script>
<script src="js/audio-ext.js"></script>
<script>
(function(){
  'use strict';
  var A = null, bed = null, vol = 1;
  var $ = function(id){ return document.getElementById(id); };

  // Same helpers as reference/v0.1.html (initAudio / env / tone / noise).
  function initAudio(){
    var AC = new (window.AudioContext || window.webkitAudioContext)();
    var master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
    var echoIn = AC.createGain(), dl = AC.createDelay(1); dl.delayTime.value = 0.3;
    var fb = AC.createGain(); fb.gain.value = 0.38;
    var ef = AC.createBiquadFilter(); ef.type = 'lowpass'; ef.frequency.value = 1800;
    var wet = AC.createGain(); wet.gain.value = 0.5;
    echoIn.connect(dl); dl.connect(ef); ef.connect(fb); fb.connect(dl); ef.connect(wet); wet.connect(master);
    var noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate), nd = noiseBuf.getChannelData(0);
    for (var i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    function env(g, t, a, d, pk){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(pk, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
    function tone(f0, f1, dur, type, pk, echo){ var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur); env(g, t, 0.012, dur, pk); o.connect(g); g.connect(master); if (echo) g.connect(echoIn); o.start(t); o.stop(t + dur + 0.05); }
    function noise(dur, ft, fq, pk){ var t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noiseBuf; f.type = ft; f.frequency.value = fq; env(g, t, 0.008, dur, pk); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05); }
    return { AC: AC, master: master, echoIn: echoIn, noiseBuf: noiseBuf, tone: tone, noise: noise };
  }
  function ensure(){
    if (!A){ try { A = window.__previewA = initAudio(); } catch (e){ $('st').textContent = 'Web Audio unavailable: ' + e.message; return null; } }
    if (A.AC.state !== 'running') A.AC.resume().catch(function(){});
    return A;
  }
  // prototype wind bed (brown noise -> lowpass with slow LFO), living-world level
  function setBed(on){
    if (!ensure()) return;
    var AC = A.AC;
    if (on && !bed){
      var len = AC.sampleRate * 4, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0), last = 0;
      for (var i = 0; i < len; i++){ last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
      var g = AC.createGain(); g.gain.value = 0;
      var lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 260;
      lfo.connect(lg); lg.connect(lp.frequency); src.connect(lp); lp.connect(g); g.connect(A.master);
      src.start(); lfo.start(); g.gain.setTargetAtTime(0.16, AC.currentTime, 0.6);
      bed = { src: src, lfo: lfo, g: g };
    } else if (!on && bed){
      var t = AC.currentTime; bed.g.gain.setTargetAtTime(0, t, 0.3); bed.src.stop(t + 1.5); bed.lfo.stop(t + 1.5);
      var old = bed; bed = null; old.src.onended = function(){ old.g.disconnect(); };
    }
  }
  function play(name, v){ if (ensure() && TW.sfxExt[name]) TW.sfxExt[name](A, v == null ? vol : v); }

  document.querySelectorAll('button[data-sfx]').forEach(function(b){
    b.addEventListener('click', function(){ play(b.dataset.sfx); });
  });
  var musicOn = {};
  document.querySelectorAll('button[data-music]').forEach(function(b){
    b.addEventListener('click', function(){
      if (!ensure()) return;
      var n = b.dataset.music; musicOn[n] = !musicOn[n];
      if (musicOn[n]) TW.music[n].start(A, vol); else TW.music[n].stop(A);
      b.classList.toggle('on', musicOn[n]);
    });
  });
  // combos are scheduled with short timeouts only here in the preview
  $('trot').addEventListener('click', function(){
    for (var i = 0; i < 8; i++) (function(i){ setTimeout(function(){ play('wolfStep', vol * (0.35 + i * 0.09)); }, i * 170); })(i);
    setTimeout(function(){ play('wolfGrowl'); }, 8 * 170 + 80);
  });
  $('walkBones').addEventListener('click', function(){
    for (var i = 0; i < 4; i++) (function(i){ setTimeout(function(){ play('bones'); }, i * 380); })(i);
  });
  $('vol').addEventListener('input', function(e){ vol = +e.target.value; $('volv').textContent = vol.toFixed(2); });
  $('bed').addEventListener('change', function(e){ setBed(e.target.checked); });
  setInterval(function(){ if (A) $('st').textContent = 'AudioContext: ' + A.AC.state + ' · ' + A.AC.sampleRate + ' Hz · t=' + A.AC.currentTime.toFixed(1) + ' s'; }, 500);
})();
</script>
</body></html>
