<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Хоёр ертөнц</title>
<style>
/* VOICE: hushed, wordless, Limbo-like grief and hope
   IDEA: a split photographic plate: a print above, its negative below
   PICTURE: the game itself, two stacked worlds filling the screen
   COLOUR and TYPE: sepia dusk vs cold negative, one red ribbon, one blue khadag; Georgia title
   LAYOUT: canvas fills the viewport, touch controls in a bar under it on phones */
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#e8e4da}
canvas{position:fixed;left:0;top:0;display:block}
#probe{position:fixed;bottom:0;left:0;height:0;padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}
#controls{position:fixed;left:0;right:0;bottom:0;display:none;pointer-events:none;z-index:4}
#controls.bar{background:linear-gradient(#070707,#000)}
.ctl{position:absolute;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.78);border:1.5px solid rgba(255,255,255,.24);background:rgba(255,255,255,.06);border-radius:999px;font-size:22px;line-height:1;box-sizing:border-box;transition:background .08s,transform .08s}
.ctl.on{background:rgba(255,255,255,.24);transform:scale(.96)}
#pad{justify-content:space-between;padding:0 24px;font-size:20px}
#pad span{opacity:.7;transition:opacity .08s}
#pad span.on{opacity:1;color:#fff;text-shadow:0 0 10px rgba(255,255,255,.7)}
#bSwitch.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(208,52,58,0)}50%{box-shadow:0 0 0 9px rgba(208,52,58,.35);border-color:rgba(255,130,130,.8)}}
#hud{position:fixed;top:8px;right:8px;display:flex;gap:6px;z-index:5}
#hud button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.4);color:rgba(255,255,255,.75);font-size:15px;padding:0;cursor:pointer}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center;padding:24px;box-sizing:border-box}
.hidden{display:none!important}
#title{background:radial-gradient(ellipse at center,rgba(0,0,0,.3),rgba(0,0,0,.85))}
#title h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.3em;padding-left:.3em;font-size:clamp(30px,8vw,54px);margin:0 0 8px;color:#efe9dc;text-shadow:0 0 28px rgba(255,240,210,.25)}
.sub{font-family:Georgia,serif;font-style:italic;opacity:.75;margin:0 0 22px;font-size:17px}
.lead{max-width:400px;margin:0 auto 24px;font-size:15px;line-height:1.6;opacity:.82}
.lead .r{color:#e0484e}.lead .b{color:#7fa7e6}
.keys{font-size:13px;opacity:.6;line-height:1.9;margin-top:20px;max-width:420px}
.btnmain{font:inherit;font-size:16px;letter-spacing:.1em;padding:13px 38px;border-radius:999px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;min-height:44px}
.btnmain:focus-visible,#hud button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.tag{position:absolute;bottom:14px;left:0;right:0;font-size:12px;opacity:.4}
#end{background:#f4f2ee;color:#1d1c1a}
#end .kick{font-size:13px;opacity:.55;margin-bottom:6px}
#end h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(32px,7vw,48px);margin:0 0 12px;letter-spacing:.06em}
#end p{max-width:360px;line-height:1.6;margin:0 auto 14px;font-size:15px}
#end .stats{font-size:13px;opacity:.6;margin-bottom:24px}
#end .btnmain{color:#1d1c1a;border-color:rgba(0,0,0,.35);background:rgba(0,0,0,.04)}
@media (prefers-reduced-motion:reduce){#bSwitch.pulse{animation:none;border-color:rgba(255,130,130,.8)}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="probe"></div>
<div id="controls">
  <div class="ctl" id="pad"><span id="pl">◀</span><span id="pr">▶</span></div>
  <div class="ctl" id="bSwitch" data-k="switch" aria-label="Дүр солих">⇅</div>
  <div class="ctl" id="bAction" data-k="action" aria-label="Татах, дуудах">◎</div>
  <div class="ctl" id="bJump" data-k="jump" aria-label="Үсрэх">▲</div>
</div>
<div id="hud" class="hidden">
  <button id="mute" aria-label="Дуу">♪</button>
  <button id="restart" aria-label="Дахин эхлэх">↺</button>
</div>
<div id="title" class="ov">
  <h1>ХОЁР ЕРТӨНЦ</h1>
  <div class="sub">Дүүгээ ол.</div>
  <div class="lead">Дээд талд <span class="b">ах</span>, амьд ертөнцөд. Доод талд <span class="r">дүү</span>, үхэгсдийн ертөнцөд.<br>Нэгнийхээ замыг нөгөө нь нээнэ.</div>
  <button class="btnmain" id="startBtn">Эхлэх</button>
  <div class="keys" id="keys"></div>
  <div class="tag">Prototype · 1-р бүлэг</div>
</div>
<div id="end" class="ov hidden">
  <div class="kick">1-р бүлэг</div>
  <h2>Хил</h2>
  <p>Ах дүү хоёр бие биенээ анх удаа мэдэрлээ.<br>Гэвч хоёр ертөнцийн хил хаалттай хэвээр…</p>
  <div class="stats" id="stats"></div>
  <button class="btnmain" id="again">Дахин тоглох</button>
  <div class="tag" style="opacity:.45">Үргэлжлэл бий</div>
</div>
<script>
(function(){
'use strict';
const H=240,G=190,LEVEL_R=3300,DEATH_Y=330,STEP=1/60,OVOO=2900;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ease=t=>t*t*(3-2*t);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

// ---------- level ----------
const LIV={ground:[[-300,560],[610,800],[960,2150],[2350,LEVEL_R]],
  blocks:[{x:-80,y:-300,w:60,h:600,k:'cliff'},{x:380,y:G-22,w:36,h:22,k:'rock'},{x:1540,y:G-26,w:30,h:26,k:'rock'},{x:3220,y:-300,w:120,h:600,k:'cliff'}]};
const DEAD={ground:[[-300,560],[610,2150],[2350,LEVEL_R]],
  blocks:[{x:-80,y:-300,w:60,h:600,k:'cliff'},{x:382,y:G-22,w:28,h:22,k:'stone'},{x:1560,y:100,w:340,h:200,k:'ledge'},{x:3220,y:-300,w:120,h:600,k:'cliff'}]};
const RIVER={x0:800,x1:960,surf:G+16};
const CPS=[[100,620,1010,1830,2370],[100,620,1200,1910,2370]];
const gapsOf=L=>{const r=[];for(let i=0;i<L.ground.length-1;i++)r.push([L.ground[i][1],L.ground[i+1][0]]);return r;};
const GAPS=[gapsOf(LIV),gapsOf(DEAD)];

// ---------- decor ----------
const DEC=[{trees:[],grass:[],fg:[]},{trees:[],grass:[],fg:[]}];
(function(){
  const keep=[[1040,1110],[1775,1835],[2015,2095],[2395,2445],[2840,2960],[780,1000],[540,630],[2130,2370]];
  for(let w=0;w<2;w++){
    const r=rng(11+w*101),L=w?DEAD:LIV,D=DEC[w];
    const onGround=x=>L.ground.some(g=>x>g[0]+12&&x<g[1]-12);
    let x=-40;
    while(x<3250){x+=80+r()*160;const f=r()<0.5?1:0.8;
      if(f===1&&(!onGround(x)||keep.some(k=>x>k[0]&&x<k[1])))continue;
      if(w===1&&f===1&&x>1550&&x<1910)continue;
      const br=[];const n=2+Math.floor(r()*(w?4:3));
      for(let i=0;i<n;i++)br.push({y:G-40-r()*130,d:r()<0.5?-1:1,l:12+r()*(w?26:32),c:0.15+r()*(w?0.7:0.4)});
      D.trees.push({x,f,wd:f===1?6+r()*7:4+r()*5,lean:(r()-0.5)*(w?34:18),br});}
    for(const g of L.ground)for(let gx=g[0]+2;gx<g[1]-1;gx+=2.5+r()*4.5)D.grass.push([gx,1.5+r()*(w?4:6),(r()-0.5)*3]);
    let fx=150;while(fx<4700){fx+=280+r()*420;D.fg.push({x:fx,h:28+r()*44,n:4+Math.floor(r()*5),s:r()*1000});}
  }
})();

// ---------- state ----------
let S;
function mkChar(i){const b=i===0;return{i,w:b?14:12,h:b?30:24,x:100,y:G-(b?30:24),vx:0,vy:0,onGround:true,face:1,walk:0,cp:100,dying:0,spawn:0,coyote:0,jumpBuf:0,
  gravity:b?1500:1150,jumpV:b?430:375,speed:b?120:118,pushing:false,look:0,lookT:0,reach:0,callCd:0,pushSnd:0,snap:false};}
function makeState(){return{t:0,time:0,mode:'title',active:0,deaths:0,
  bridge:{on:false,p:0},gate:{on:false,p:0},rope:{on:false,p:0},plate:{pressed:false},ghost:{a:0},
  levers:[{x:1072,y:G,on:false,p:0,target:'bridge'},{x:1740,y:100,on:false,p:0,target:'gate'},{x:2420,y:G,on:false,p:0,target:'rope'}],
  crate:{x:1300,y:G-40,w:40,h:40,vy:0,onGround:true,home:1300,respawn:0,fade:1},
  chars:[mkChar(0),mkChar(1)],ripples:[],parts:[],amb:[[],[]],cams:[0,0],stage:1,stageT:0,
  ending:null,introCall:false,flash:[0,0],swf:[0,0],glow:0,white:0};}

// ---------- physics ----------
function gateRect(){const e=ease(S.gate.p);return{x:1800,y:40-e*150,w:14,h:150};}
function solidsFor(w,noCrate){
  const out=[],L=w?DEAD:LIV,cr=S.crate;
  for(const g of L.ground)out.push({x:g[0],y:G,w:g[1]-g[0],h:300});
  for(const b of L.blocks)out.push({x:b.x,y:b.y,w:b.w,h:b.h});
  if(w===0){
    if(S.bridge.p>=1)out.push({x:800,y:G,w:160,h:14});
    out.push(gateRect());
    if(S.rope.p>=1)out.push({x:2150,y:G,w:200,h:14});
    if(!noCrate&&cr.respawn<=0)out.push({x:cr.x,y:cr.y,w:cr.w,h:cr.h,isCrate:true});
  }else{
    if(S.ghost.a>0.5)out.push({x:2150,y:G,w:200,h:14});
    if(cr.respawn<=0)out.push({x:cr.x,y:cr.y,w:cr.w,h:cr.h});
  }
  return out;
}
function prefilter(b,sol){for(const s of sol)s.skip=overlap(b,s);}
function moveX(b,dx,sol){if(!dx)return;b.x+=dx;for(const s of sol){if(s.skip)continue;if(overlap(b,s))b.x=dx>0?s.x-b.w:s.x+s.w;}}
function moveY(b,dy,sol){b.y+=dy;b.onGround=false;for(const s of sol){if(s.skip)continue;if(overlap(b,s)){if(dy>0){b.y=s.y-b.h;b.onGround=true;}else b.y=s.y+s.h;b.vy=0;}}}

const IDLE={};
function updateChar(c,dt,inp){
  if(c.dying>0){c.dying-=dt;if(c.dying<=0)respawn(c);return;}
  if(c.spawn>0)c.spawn=Math.max(0,c.spawn-dt*2.2);
  if(c.lookT>0){c.lookT-=dt;if(c.lookT<=0)c.look=0;}
  if(c.callCd>0)c.callCd-=dt;
  const dir=(inp.right?1:0)-(inp.left?1:0),acc=c.onGround?1100:750,want=dir*c.speed;
  if(c.vx<want)c.vx=Math.min(want,c.vx+acc*dt);else if(c.vx>want)c.vx=Math.max(want,c.vx-acc*dt);
  if(dir)c.face=dir;
  c.coyote=c.onGround?0.1:Math.max(0,c.coyote-dt);
  c.jumpBuf=inp.jumpPressed?0.13:Math.max(0,c.jumpBuf-dt);
  if(c.jumpBuf>0&&c.coyote>0){c.vy=-c.jumpV;c.jumpBuf=0;c.coyote=0;sfx('jump');}
  c.vy=Math.min(c.vy+c.gravity*dt,520);
  const wasG=c.onGround,vyB=c.vy,sol=solidsFor(c.i);prefilter(c,sol);
  let dx=c.vx*dt;c.pushing=false;
  const cr=S.crate;
  if(c.i===0&&dx&&c.onGround&&cr.respawn<=0&&!overlap(c,cr)&&overlap({x:c.x+dx,y:c.y,w:c.w,h:c.h},cr)&&c.y+c.h>cr.y+3){
    const pdx=Math.sign(dx)*Math.min(Math.abs(dx),62*dt),cs=solidsFor(0,true);prefilter(cr,cs);
    const bx=cr.x;moveX(cr,pdx,cs);const moved=cr.x-bx;
    if(Math.abs(moved)>1e-3){c.pushing=true;dx=moved;c.vx=Math.sign(c.vx)*Math.min(Math.abs(c.vx),62);
      for(const s of sol)if(s.isCrate)s.x=cr.x;
      c.pushSnd-=dt;if(c.pushSnd<=0){c.pushSnd=0.24;sfx('push');}}
  }
  moveX(c,dx,sol);moveY(c,c.vy*dt,sol);
  if(c.onGround&&!wasG&&vyB>260)sfx('land');
  c.walk+=Math.abs(c.vx)*dt*(c.i?0.21:0.17);
  if(c.onGround)for(const cp of CPS[c.i])if(c.x>=cp&&cp>c.cp)c.cp=cp;
  const cx=c.x+c.w/2;
  if(c.i===0&&cx>RIVER.x0&&cx<RIVER.x1&&c.y+c.h>RIVER.surf+3){die(c,'water');return;}
  if(c.y>DEATH_Y)die(c,'fall');
}
function die(c,why){
  if(c.dying>0)return;c.dying=0.95;c.vx=0;c.vy=0;S.deaths++;S.flash[c.i]=1;
  const cx=c.x+c.w/2,cy=c.y+c.h/2;
  for(let k=0;k<26;k++)S.parts.push({w:c.i,x:cx+(Math.random()-0.5)*c.w,y:cy+(Math.random()-0.5)*c.h,vx:(Math.random()-0.5)*90,vy:-Math.random()*90-10,life:0.8+Math.random()*0.7,max:1.5,s:1+Math.random()*2,c:c.i?'#eef0f3':'#0a0908',g:why==='water'?280:120});
  if(why==='water'){splash(cx,RIVER.surf);sfx('splash');}
  sfx('death');
}
function respawn(c){c.x=c.cp;c.y=G-c.h;c.vx=0;c.vy=0;c.dying=0;c.spawn=1;c.onGround=true;c.face=1;c.snap=true;}
function splash(x,y){for(let k=0;k<20;k++)S.parts.push({w:0,x:x+(Math.random()-0.5)*14,y,vx:(Math.random()-0.5)*110,vy:-60-Math.random()*120,life:0.5+Math.random()*0.4,max:0.9,s:1+Math.random()*1.5,c:'rgba(215,203,175,0.85)',g:420});}

function updateCrate(dt){
  const c=S.crate;
  if(c.respawn>0){c.respawn-=dt;c.y+=8*dt;if(c.respawn<=0){c.x=c.home;c.y=G-40;c.vy=0;c.fade=0;}return;}
  c.fade=Math.min(1,c.fade+dt*2);
  c.vy=Math.min(c.vy+1500*dt,520);
  const sol=solidsFor(0,true);prefilter(c,sol);moveY(c,c.vy*dt,sol);
  const cx=c.x+c.w/2;
  if(c.y>DEATH_Y||(cx>RIVER.x0&&cx<RIVER.x1&&c.y+c.h>RIVER.surf+10)){c.respawn=0.8;if(c.y<DEATH_Y){splash(cx,RIVER.surf);sfx('splash');}}
}
function doAction(c){
  if(c.dying>0)return;
  const cx=c.x+c.w/2;
  if(c.i===1)for(const l of S.levers)if(!l.on&&Math.abs(cx-l.x)<16&&Math.abs(c.y+c.h-l.y)<6){pullLever(l);return;}
  if(c.callCd>0)return;c.callCd=0.7;
  callFrom(c);
}
function callFrom(c){
  const cx=c.x+c.w/2,cy=c.y+c.h*0.45;
  S.ripples.push({w:c.i,x:cx,y:cy,t:0,c:c.i?'232,236,244':'30,27,22'});
  S.ripples.push({w:1-c.i,x:cx,y:cy,t:-0.15,c:c.i?'208,52,58':'150,190,255'});
  sfx(c.i?'callS':'callB');
  const o=S.chars[1-c.i];
  if(o.dying<=0){o.lookT=1.4;o.look=c.i===0?1:-1;if(Math.abs(o.vx)<5)o.face=cx>=o.x+o.w/2?1:-1;}
}
function pullLever(l){
  l.on=true;S[l.target].on=true;sfx('lever');sfx('rumble');
  const t={bridge:[880,G-40],gate:[1807,110],rope:[2250,G-10]}[l.target];
  S.ripples.push({w:0,x:t[0],y:t[1],t:0,c:'208,52,58',big:true});
  S.ripples.push({w:1,x:l.x,y:l.y-10,t:0,c:'208,52,58'});
}
function updateWorld(dt){
  for(const k of ['bridge','gate','rope']){const o=S[k];if(o.on&&o.p<1)o.p=Math.min(1,o.p+dt/1.4);}
  for(const l of S.levers)if(l.on&&l.p<1)l.p=Math.min(1,l.p+dt*4);
  const b=S.chars[0],bc=b.x+b.w/2;
  const pr=b.dying<=0&&b.onGround&&bc>=2030&&bc<=2080&&Math.abs(b.y+b.h-G)<1.5;
  if(pr&&!S.plate.pressed){sfx('ghost');S.ripples.push({w:1,x:2250,y:G-8,t:0,c:'200,215,245',big:true});}
  S.plate.pressed=pr;
  S.ghost.a+=((pr?1:0)-S.ghost.a)*Math.min(1,dt*(pr?4:7));
}
function computeStage(){
  if(!S.bridge.on)return 1;
  if(!S.gate.on)return S.crate.x<1470?2:3;
  if(!S.rope.on)return S.chars[1].x+S.chars[1].w/2<2360?4:5;
  return 6;
}
function hintTarget(){
  const s=S.chars[1];
  switch(S.stage){
    case 1:return{w:1,x:1072,y:G-12};
    case 2:return{w:0,x:S.crate.x+20,y:S.crate.y+20};
    case 3:return s.y+s.h<=101?{w:1,x:1740,y:88}:{w:1,x:S.crate.x+20,y:S.crate.y+20};
    case 4:return S.plate.pressed?{w:1,x:2250,y:G-8}:{w:0,x:2055,y:G-6};
    case 5:return{w:1,x:2420,y:G-12};
  }return null;
}
function updateStage(dt){const st=computeStage();if(st!==S.stage){S.stage=st;S.stageT=0;}else S.stageT+=dt;}
function checkEnding(){
  if(S.stage!==6)return;
  const ok=c=>c.dying<=0&&c.onGround&&Math.abs(c.x+c.w/2-OVOO)<45;
  if(ok(S.chars[0])&&ok(S.chars[1])){S.mode='ending';S.ending={t:0};setHint(false);}
}
function updateEnding(dt){
  const E=S.ending;E.t+=dt;
  for(const c of S.chars){const cx=c.x+c.w/2;c.speed=55;updateChar(c,dt,{left:E.t<2.6&&cx>OVOO+1.5,right:E.t<2.6&&cx<OVOO-1.5});}
  if(E.t>1.6){const r=Math.min(1,(E.t-1.6)/0.8);S.chars[0].reach=r;S.chars[1].reach=r;S.chars[0].look=-1;S.chars[1].look=1;S.chars[0].lookT=9;S.chars[1].lookT=9;}
  S.glow=clamp((E.t-0.8)/1.5,0,1);
  S.white=clamp((E.t-3.8)/1.6,0,1);
  if(E.t>1.8&&!E.chord){E.chord=true;sfx('end');}
  if(E.t>5.6&&!E.shown){E.shown=true;showEnd();}
  updateWorld(dt);
}
function switchChar(){S.active^=1;S.swf[S.active]=1;sfx('switch');ambience();}

// ---------- input ----------
const K={},T={},TST={},latch={};
function readInput(){
  const r={};for(const k of ['left','right','jump','action','switch'])r[k]=!!(K[k]||T[k]||TST[k]);
  r.jumpPressed=!!latch.jump;r.actionPressed=!!latch.action;r.switchPressed=!!latch.switch;
  latch.jump=latch.action=latch.switch=false;return r;
}
function update(dt){
  S.t+=dt;
  const inp=readInput();
  if(S.mode==='play'){
    S.time+=dt;
    if(inp.switchPressed)switchChar();
    for(const c of S.chars)updateChar(c,dt,c.i===S.active?inp:IDLE);
    if(inp.actionPressed)doAction(S.chars[S.active]);
    updateCrate(dt);updateWorld(dt);updateStage(dt);checkEnding();

      ctx.fillStyle=`rgba(${w===0?'208,52,58':'150,190,255'},${k})`;ctx.beginPath();
      if(L){ctx.moveTo(x-5,ey);ctx.lineTo(x+3,ey-5);ctx.lineTo(x+3,ey+5);}else{ctx.moveTo(x+5,ey);ctx.lineTo(x-3,ey-5);ctx.lineTo(x-3,ey+5);}ctx.fill();}
    const ht=hintTarget(),need=!!ht&&ht.w!==S.active&&S.stageT>5;
    setHint(need&&touchUI);
    if(need&&!touchUI){const p=panels[ht.w],k=0.5+0.5*Math.sin(S.t*4);ctx.font='600 12px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle=`rgba(255,255,255,${0.35+0.4*k})`;ctx.fillText('⇅  Q',p.x+p.w/2,p.y+12);ctx.textAlign='left';}
  }
  if(S.mode==='ending'){
    const a=clamp((S.ending.t-1.8)/1.0,0,1);
    if(a>0){const [b,s]=S.chars,p0=panels[0],p1=panels[1];
      const bx=p0.x+(b.x+b.w/2-S.cams[0])*p0.scale,by=p0.y+(b.y+b.h*0.55-p0.top)*p0.scale,sx=p1.x+(s.x+s.w/2-S.cams[1])*p1.scale,sy=p1.y+(s.y+s.h*0.5-p1.top)*p1.scale;
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
      for(const [lw,al] of [[16,0.07],[7,0.16],[2.2,0.6]]){ctx.strokeStyle=`rgba(255,245,225,${al*a})`;ctx.lineWidth=lw*p0.scale;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(sx,sy);ctx.stroke();}
      ctx.restore();}
  }
  if(S.white>0){ctx.fillStyle=`rgba(244,242,238,${S.white})`;ctx.fillRect(0,0,VW,GH);}
  if(!grainPat)grainPat=ctx.createPattern(grain,'repeat');
  ctx.save();ctx.globalAlpha=0.05;ctx.globalCompositeOperation='overlay';ctx.translate(-(Math.random()*128|0),-(Math.random()*128|0));ctx.fillStyle=grainPat;ctx.fillRect(0,0,VW+128,GH+128);ctx.restore();
}

// ---------- flow ----------
const $=id=>document.getElementById(id);
function startGame(){
  if(!AC)initAudio();if(AC&&AC.state!=='running')AC.resume().catch(()=>{});
  S=makeState();S.mode='play';updateCams(0,true);
  $('title').classList.add('hidden');$('end').classList.add('hidden');$('hud').classList.remove('hidden');
  if(AC)master.gain.value=muted?0:0.9;
  ambience();
}
function showEnd(){
  const m=Math.floor(S.time/60),s=Math.floor(S.time%60);
  $('stats').textContent=`Хугацаа ${m}:${String(s).padStart(2,'0')} · ${S.deaths} удаа үхсэн`;
  $('end').classList.remove('hidden');$('hud').classList.add('hidden');ambience();
}
$('startBtn').addEventListener('click',startGame);
$('again').addEventListener('click',startGame);
$('restart').addEventListener('click',e=>{e.currentTarget.blur();startGame();});
$('mute').addEventListener('click',e=>{muted=!muted;e.currentTarget.textContent=muted?'×':'♪';if(AC)master.gain.value=muted?0:0.9;e.currentTarget.blur();});
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else if(S.mode!=='title')AC.resume().catch(()=>{});});
addEventListener('resize',layout);

S=makeState();layout();updateCams(0,true);
let last=performance.now(),acc=0,paused=false;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  if(!paused){acc+=dt;let n=0;while(acc>=STEP&&n<8){update(STEP);acc-=STEP;n++;}if(n===8)acc=0;}
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game={S:()=>S,update:n=>{for(let i=0;i<(n||1);i++)update(STEP);},T:TST,latch,start:startGame,pause:v=>{paused=v;},render};
})();
</script>
