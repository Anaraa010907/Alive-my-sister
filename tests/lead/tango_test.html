<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Хоёр ертөнц</title>
<style>
/* VOICE: hushed, wordless, Limbo-like grief and hope
   IDEA: a split photographic plate: a print above, its negative below
   PICTURE: the game itself, two stacked worlds filling the screen
   COLOUR and TYPE: sepia dusk vs cold negative, one red ribbon, one blue khadag; Georgia titles
   LAYOUT: canvas fills the viewport, touch controls in a bar under it on phones */
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#e8e4da}
canvas{position:fixed;left:0;top:0;display:block}
#probe{position:fixed;bottom:0;left:0;height:0;padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}
#controls{position:fixed;left:0;right:0;bottom:0;display:none;pointer-events:none;z-index:4}
#controls.bar{background:linear-gradient(#070707,#000)}
.ctl{position:absolute;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.78);border:1.5px solid rgba(255,255,255,.24);background:rgba(255,255,255,.06);border-radius:999px;font-size:22px;line-height:1;box-sizing:border-box;transition:background .08s,transform .08s}
.ctl.on{background:rgba(255,255,255,.24);transform:scale(.96)}
#pad{justify-content:space-between;padding:0 24px;font-size:20px}
#pad span{opacity:.7;transition:opacity .08s}
#pad span.on{opacity:1;color:#fff;text-shadow:0 0 10px rgba(255,255,255,.7)}
#bSwitch.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(208,52,58,0)}50%{box-shadow:0 0 0 9px rgba(208,52,58,.35);border-color:rgba(255,130,130,.8)}}
@media (prefers-reduced-motion:reduce){#bSwitch.pulse{animation:none;border-color:rgba(255,130,130,.8)}}
#twpz{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);touch-action:manipulation}
#twpz.open{display:flex}
#twpz .f{width:min(820px,96vw);height:min(370px,94vh);background:#0d0c0b;border:1px solid rgba(255,255,255,.14);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
#twpz .h{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 18px;border-bottom:1px solid rgba(255,255,255,.08);color:#efe9dc;min-height:48px;box-sizing:border-box}
#twpz .ti{font-family:Georgia,"Times New Roman",serif;font-size:19px;letter-spacing:.04em}
#twpz .su{flex:1;font-size:13px;opacity:.6}
#twpz .x{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent;color:#ddd;font-size:17px;cursor:pointer}
#twpz .b{flex:1;min-height:0;position:relative;overflow:hidden;color:#efe9dc;user-select:none;-webkit-user-select:none}
#twpz .twpz-fallback{margin-top:16px;min-height:44px;padding:0 22px;border-radius:99px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font-size:15px}
</style>
<link rel="stylesheet" href="../../css/ui.css">
<link rel="stylesheet" href="../../css/puzzles.css">
<link rel="stylesheet" href="../../css/puzzles-b.css">
</head>
<body>
<canvas id="cv"></canvas>
<div id="probe"></div>
<div id="controls">
  <div class="ctl" id="pad"><span id="pl">◀</span><span id="pr">▶</span></div>
  <div class="ctl" id="bSwitch" data-k="switch" aria-label="Дүр солих">⇅</div>
  <div class="ctl" id="bAction" data-k="action" aria-label="Татах, дуудах">◎</div>
  <div class="ctl" id="bJump" data-k="jump" aria-label="Үсрэх">▲</div>
</div>
<div id="twpz" role="dialog" aria-modal="true"><div class="f"><div class="h"><span class="ti"></span><span class="su"></span><button class="x" aria-label="Хаах">✕</button></div><div class="b"></div></div></div>
<script src="../../js/tw.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/net.js"></script>
<script src="../../js/audio-ext.js"></script>
<script src="../../js/art-enemies.js"></script>
<script src="../../js/enemies.js"></script>
<script src="../../js/puzzles.js"></script>
<script src="../../js/puzzles-b.js"></script>
<script src="../../js/levels/ch1.js"></script>
<script src="../../js/levels/ch2.js"></script>
<script src="tango.js"></script>
<script src="../../js/game.js"></script>
</body>
</html>
