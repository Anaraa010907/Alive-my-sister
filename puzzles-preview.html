<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Хоёр ертөнц — оньсого A (тамга, хэнгэрэг, од, агуй)</title>
<link rel="stylesheet" href="css/puzzles.css">
<link rel="stylesheet" href="css/puzzles-b.css">
<style>
html,body{margin:0;background:#050505;color:#e8e4da;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
body{padding:14px 16px 40px;box-sizing:border-box}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.18em;font-size:22px;margin:0 0 4px;color:#efe9dc}
.pv-sub{opacity:.6;margin:0 0 14px;font-size:12.5px}
.pv-bar0{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.pv-bar0 label{opacity:.7;font-size:12px}
.pv-bar0 input[type=text]{width:110px;background:#111;border:1px solid #333;color:#eee;border-radius:6px;padding:6px 8px;font:inherit}
.pv-btn{-webkit-appearance:none;appearance:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#f4f0e6;font:inherit;font-size:13px;cursor:pointer}
.pv-btn:hover{background:rgba(255,255,255,.12)}
.pv-kind{border-top:1px solid #1d1c1a;padding:12px 0 6px}
.pv-kind h2{font-family:Georgia,serif;font-weight:400;font-size:17px;letter-spacing:.1em;margin:0 0 8px;color:#efe9dc}
.pv-kind h2 small{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:0;opacity:.5;margin-left:8px}
.pv-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.pv-cvs{display:flex;flex-wrap:wrap;gap:10px}
.pv-cvs figure{margin:0}
.pv-cvs canvas{display:block;width:500px;max-width:100%;aspect-ratio:400/240;border:1px solid #1d1c1a;border-radius:4px}
.pv-cvs figcaption{font-size:11px;opacity:.5;margin-top:3px}
.pv-ans{font:10px/1.3 ui-monospace,Menlo,Consolas,monospace;color:rgba(239,233,220,.38);margin:2px 0 0}
/* ---- overlay frame shaped like the engine's #twpz (title bar + ✕), max 844×390, body 780×290 ---- */
.pv-ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
.pv-ov[hidden]{display:none}
.pv-f{position:relative;width:min(844px,100vw);height:min(390px,100vh);box-sizing:border-box;background:#0d0c0b;border:1px solid rgba(255,255,255,.14);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.pv-h{display:flex;align-items:center;gap:10px;padding:2px 8px 2px 18px;border-bottom:1px solid rgba(255,255,255,.08);color:#efe9dc;min-height:48px;box-sizing:border-box}
.pv-ti{font-family:Georgia,"Times New Roman",serif;font-size:19px;letter-spacing:.04em}
.pv-su{flex:1;font-size:13px;opacity:.6}
.pv-x{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent;color:#ddd;font-size:17px;cursor:pointer}
.pv-bw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.pv-b{position:relative;width:min(780px,100%);height:min(290px,100%);overflow:hidden;color:#efe9dc;-webkit-user-select:none;user-select:none}
.pv-dbg{position:absolute;left:18px;right:18px;bottom:3px;font:9.5px/1.2 ui-monospace,Menlo,Consolas,monospace;color:rgba(239,233,220,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.pv-log{position:fixed;left:8px;bottom:6px;z-index:20;font:11px ui-monospace,Menlo,monospace;color:rgba(239,233,220,.6);pointer-events:none;white-space:pre}
</style>
</head>
<body>
<h1>ОНЬСОГО A</h1>
<p class="pv-sub">тамга · хэнгэрэг · одны зураг · агуй (+ B-ийн төрлүүд байвал) — drawDevice / drawClue in both palettes; solve / showClue in an engine-shaped frame (844×390, body 780×290). The correct answer is printed in tiny debug text.</p>
<div class="pv-bar0">
  <label for="pvSeed">seed</label><input id="pvSeed" type="text" value="20261126" inputmode="numeric">
  <button class="pv-btn" id="pvNew" type="button">шинэ seed</button>
  <label><input id="pvSolved" type="checkbox"> шийдсэн төлөв (drawDevice solved)</label>
</div>
<div id="pvKinds"></div>
<div class="pv-ov" id="pvOv" hidden>
  <div class="pv-f" id="twpz" role="dialog" aria-modal="true">
    <div class="pv-h"><span class="pv-ti"></span><span class="pv-su"></span><button class="pv-x" type="button" aria-label="Хаах">&#x2715;</button></div>
    <div class="pv-bw"><div class="pv-b"></div></div>
    <div class="pv-dbg"></div>
  </div>
</div>
<div class="pv-log" id="pvLog"></div>

<script>
// ---- stub TW (only what puzzle modules may touch) ----
window.TW = {G: 190, H: 240, puzzles: {}};
</script>
<script src="js/puzzles.js"></script>
<script src="js/puzzles-b.js" onerror="this.remove()"></script>
<script>
(function(){
'use strict';
var TW = window.TW, G = TW.G;
function rng(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s){ var h = 2166136261; for (var i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0; }
var PAL = [
  {world:0, sil:'#0b0a09', rim:'rgba(160,145,120,0.25)', eye:'#f3efe4', pale:'#c2c7cf', red:'#c8262d', blue:'#467dcd'},
  {world:1, sil:'#05060a', rim:'rgba(210,218,232,0.35)', eye:'#eef0f3', pale:'#c2c7cf', red:'#c8262d', blue:'#467dcd'}
];
var MINE = ['symbols', 'drum', 'stars', 'maze'];
var NOTES = {symbols: '9 тамгаас 4-ийг дарааллаар · 9·8·7·6 = 3024', drum: '5–6 цохилт, урт/богино · ≥ 1/75', stars: '4×3 од, 3–5 зураас · ≫ 1000', maze: '4 салаа × 3 хаалга · 3⁴ = 81'};
var seedEl = document.getElementById('pvSeed'), solvedEl = document.getElementById('pvSolved');
function seed(){ return (parseInt(seedEl.value, 10) || 0) >>> 0; }
function objFor(kind){ return kind === 'split' ? {id: 'SPA', kind: kind, params: {pair: 'P1', side: 0}} : {id: 'PZ_' + kind, kind: kind, params: {}}; }
// engine seeding: session seed + (params.pair || puzzle id)
function genFor(kind, s){
  var T = TW.puzzles[kind], o = objFor(kind);
  return T.gen(rng(hashStr(String(s) + ':' + ((o.params && o.params.pair) || o.id))), o.params);
}
function answerOf(kind, d){ var T = TW.puzzles[kind]; try { return T.answerText ? T.answerText(d) : JSON.stringify(d); } catch (e){ return '?'; } }
function kinds(){ return MINE.filter(function(k){ return TW.puzzles[k]; }).concat(Object.keys(TW.puzzles).filter(function(k){ return MINE.indexOf(k) < 0 && TW.puzzles[k] && TW.puzzles[k].solve; })); }

// ---- in-world canvases (400×240 logical, ground at G) ----
var cvs = [];
function backdrop(ctx, w){
  var g = ctx.createLinearGradient(0, -160, 0, 200);
  if (w === 0){ g.addColorStop(0, '#13110f'); g.addColorStop(0.5, '#3d382f'); g.addColorStop(0.82, '#8c816b'); g.addColorStop(1, '#a3967b'); }
  else { g.addColorStop(0, '#000'); g.addColorStop(0.55, '#06070a'); g.addColorStop(0.85, '#181c24'); g.addColorStop(1, '#252a34'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, 400, 240);
  var r;
  if (w === 0){ r = ctx.createRadialGradient(120, 125, 0, 120, 125, 150); r.addColorStop(0, 'rgba(240,226,192,0.5)'); r.addColorStop(1, 'rgba(230,212,175,0)'); ctx.fillStyle = r; ctx.fillRect(0, 0, 400, 240); }
  else { r = ctx.createRadialGradient(330, 40, 0, 330, 40, 90); r.addColorStop(0, 'rgba(210,218,232,0.16)'); r.addColorStop(1, 'rgba(210,218,232,0)'); ctx.fillStyle = r; ctx.fillRect(0, 0, 400, 240); ctx.fillStyle = 'rgba(225,230,240,0.13)'; ctx.beginPath(); ctx.arc(330, 40, 14, 0, 7); ctx.fill(); }
  ctx.fillStyle = w ? '#1d2129' : '#5a5346'; ctx.beginPath(); ctx.moveTo(0, 240);
  for (var x = 0; x <= 400; x += 10) ctx.lineTo(x, 172 - 14 * (0.5 + 0.5 * Math.sin(x * 0.02 + (w ? 2 : 0))));
  ctx.lineTo(400, 240); ctx.fill();
  ctx.fillStyle = w ? '#c2c7cf' : '#0b0a09'; ctx.fillRect(0, G, 400, 60);
  if (w){ ctx.fillStyle = '#e2e5ea'; ctx.fillRect(0, G, 400, 1); }
}
function figure(ctx, w, x){
  ctx.save(); ctx.translate(x, G);
  if (w === 0){ ctx.fillStyle = '#0b0a09'; ctx.beginPath(); ctx.ellipse(0, -26, 4.6, 5, 0, 0, 7); ctx.fill(); ctx.fillRect(-5, -21, 10, 13); ctx.fillRect(-4.5, -9, 3, 9); ctx.fillRect(1.5, -9, 3, 9);
    ctx.fillStyle = '#f3efe4'; ctx.beginPath(); ctx.arc(2.6, -26.5, 1, 0, 7); ctx.arc(4.6, -26.4, 0.9, 0, 7); ctx.fill(); }
  else { ctx.fillStyle = '#eef0f3'; ctx.beginPath(); ctx.ellipse(0, -20, 4, 4.3, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.moveTo(-3.5, -16); ctx.lineTo(3.5, -16); ctx.lineTo(5.5, -6); ctx.lineTo(-5.5, -6); ctx.fill(); ctx.fillRect(-3, -6, 2.2, 6); ctx.fillRect(0.8, -6, 2.2, 6);
    ctx.fillStyle = '#c8262d'; ctx.beginPath(); ctx.moveTo(-3.4, -22.6); ctx.lineTo(-6.2, -25.2); ctx.lineTo(-6.6, -21.8); ctx.fill(); }
  ctx.restore();
}
function label(ctx, w, text, x){ ctx.font = '8px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = w ? 'rgba(20,24,32,.75)' : 'rgba(200,190,170,.6)'; ctx.fillText(text, x, G + 16); }
function drawCanvas(c){
  var cv = c.cv, dpr = window.devicePixelRatio || 1, cw = cv.clientWidth || 500;
  var pw = Math.round(cw * dpr), ph = Math.round(cw * 240 / 400 * dpr);
  if (cv.width !== pw || cv.height !== ph){ cv.width = pw; cv.height = ph; }
  var ctx = cv.getContext('2d'), s = pw / 400, t = c.t != null ? c.t : performance.now() / 1000, T = TW.puzzles[c.kind], P = PAL[c.w];
  ctx.setTransform(s, 0, 0, s, 0, 0); backdrop(ctx, c.w);
  try {
    if (c.w === 0){   // living: device (main), solved device, and a clue as if the clue were in the living world
      T.drawDevice(ctx, {x: 70, kind: c.kind}, t, P, !!solvedEl.checked);
      figure(ctx, 0, 112);
      T.drawDevice(ctx, {x: 175, kind: c.kind}, t, P, true);
      T.drawClue(ctx, {x: 300, puzzle: 'PZ'}, c.data, t, P);
      label(ctx, 0, 'төхөөрөмж', 70); label(ctx, 0, 'шийдсэн', 175); label(ctx, 0, 'сэжүүр (амьд талд)', 300);
    } else {          // dead: clue (main), and the device as if it stood in the dead world
      T.drawClue(ctx, {x: 100, puzzle: 'PZ'}, c.data, t, P);
      figure(ctx, 1, 142);
      T.drawDevice(ctx, {x: 230, kind: c.kind}, t, P, !!solvedEl.checked);
      T.drawDevice(ctx, {x: 330, kind: c.kind}, t, P, true);
      label(ctx, 1, 'сэжүүр', 100); label(ctx, 1, 'төхөөрөмж (үхэгсдийн талд)', 230); label(ctx, 1, 'шийдсэн', 330);
    }
  } catch (e){ console.error(e); }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
function frameLoop(){ cvs.forEach(drawCanvas); requestAnimationFrame(frameLoop); }

function build(){
  var host = document.getElementById('pvKinds'); host.innerHTML = ''; cvs = [];
  kinds().forEach(function(kind){
    var T = TW.puzzles[kind], data;
    try { data = genFor(kind, seed()); } catch (e){ console.error(e); return; }
    var sec = document.createElement('section'); sec.className = 'pv-kind'; sec.id = 'pv-' + kind;
    var h = document.createElement('h2'); h.textContent = (T.title || kind) + ' '; var sm = document.createElement('small'); sm.textContent = kind + (NOTES[kind] ? ' · ' + NOTES[kind] : ''); h.appendChild(sm); sec.appendChild(h);
    var row = document.createElement('div'); row.className = 'pv-row';
    [['Шийдэх (solve)', 'solve'], ['Сэжүүр (showClue)', 'clue']].forEach(function(a){
      var b = document.createElement('button'); b.type = 'button'; b.className = 'pv-btn'; b.textContent = a[0]; b.setAttribute('data-open', kind + ':' + a[1]);
      b.addEventListener('click', function(){ open(kind, a[1]); }); row.appendChild(b);
    });
    sec.appendChild(row);
    var grid = document.createElement('div'); grid.className = 'pv-cvs';
    [0, 1].forEach(function(w){
      var f = document.createElement('figure'), cv = document.createElement('canvas'); cv.id = 'cv-' + kind + '-' + w; f.appendChild(cv);
      var cap = document.createElement('figcaption'); cap.textContent = w ? 'world 1 — үхэгсдийн ертөнц (dead palette)' : 'world 0 — амьд ертөнц (living palette)'; f.appendChild(cap);
      grid.appendChild(f); cvs.push({cv: cv, kind: kind, w: w, data: data});
    });
    sec.appendChild(grid);
    var ans = document.createElement('p'); ans.className = 'pv-ans'; ans.textContent = 'зөв: ' + answerOf(kind, data); sec.appendChild(ans);
    host.appendChild(sec);
  });
}

// ---- engine-shaped overlay ----
var ov = document.getElementById('pvOv'), fr = document.getElementById('twpz'), body = fr.querySelector('.pv-b'), logEl = document.getElementById('pvLog');
var cur = null, hist = [], delay = {ok: 700, bad: 450};   // engine: close 700 ms after success, 450 ms after fail
function log(s){ hist.push(s); if (hist.length > 6) hist.shift(); logEl.textContent = hist.join('\n'); }
function open(kind, mode, opts){
  opts = opts || {}; closeNow('reopen');
  var T = TW.puzzles[kind], data = opts.data || genFor(kind, opts.seed != null ? opts.seed : seed());
  fr.querySelector('.pv-ti').textContent = T.title || kind;
  fr.querySelector('.pv-su').textContent = mode === 'clue' ? 'Найздаа хэлж өг' : 'Найзаасаа асууж шийд';
  fr.querySelector('.pv-dbg').textContent = 'seed ' + seed() + ' · зөв: ' + answerOf(kind, data);
  body.innerHTML = '';
  var z = {kind: kind, mode: mode, data: data, calls: {success: 0, fail: 0, close: 0}, cleanup: null, closed: false, done: false, timer: 0};
  cur = z;
  var api = {
    success: function(){ z.calls.success++; log(kind + ' success #' + z.calls.success); if (z.mode !== 'solve' || z.done) return; z.done = true; z.timer = setTimeout(function(){ if (cur === z) closeNow('engine'); }, delay.ok); },
    fail: function(){ z.calls.fail++; log(kind + ' fail #' + z.calls.fail); if (z.mode !== 'solve' || z.done) return; z.done = true; z.timer = setTimeout(function(){ if (cur === z) closeNow('engine'); }, delay.bad); },
    close: function(){ z.calls.close++; log(kind + ' close'); if (cur === z) closeNow('api'); }
  };
  try { var r = mode === 'clue' ? T.showClue(body, data, api) : T.solve(body, data, api); if (typeof r === 'function') z.cleanup = r; }
  catch (e){ console.error(e); body.textContent = 'Алдаа гарлаа'; }
  ov.hidden = false; hist.push('— ' + kind + ' ' + mode);
  return data;
}
function closeNow(why){
  var z = cur; if (!z) return; cur = null; z.closed = why || true; clearTimeout(z.timer);
  try { if (z.cleanup) z.cleanup(); } catch (e){ console.error(e); }
  body.innerHTML = ''; ov.hidden = true; last = z;
}
var last = null;
fr.querySelector('.pv-x').addEventListener('click', function(){ closeNow('x'); });
addEventListener('keydown', function(e){ if (e.key === 'Escape' && cur){ e.preventDefault(); closeNow('esc'); } });
seedEl.addEventListener('change', build);
document.getElementById('pvNew').addEventListener('click', function(){ seedEl.value = String((Math.random() * 1e9) | 0); build(); });

window.__pz = {
  open: open, close: function(){ closeNow('test'); }, genFor: genFor, answerOf: answerOf, kinds: kinds, PAL: PAL,
  get cur(){ return cur && {kind: cur.kind, mode: cur.mode, data: cur.data, calls: cur.calls}; },
  get last(){ return last && {kind: last.kind, mode: last.mode, calls: last.calls, closed: last.closed}; },
  set closeDelay(v){ delay = v; },
  freeze: function(t){ cvs.forEach(function(c){ c.t = t; drawCanvas(c); }); },
  redraw: function(){ cvs.forEach(drawCanvas); }
};
build();
requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
